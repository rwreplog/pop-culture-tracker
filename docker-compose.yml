services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geekery
      POSTGRES_PASSWORD: geekery
      POSTGRES_DB: geekery
    ports:
      - "5432:5432"
    volumes:
      - geekery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekery -d geekery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geekery-postgres:
